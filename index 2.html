<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>⚡ منصة بَرق التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
  margin:0;
  font-family:'Tajawal',sans-serif;
  background: linear-gradient(to bottom,#fdf6e3,#e0f7fa);
  color:#1F2937;
  position:relative;
}
.page{display:none; text-align:center; min-height:100vh; padding-top:50px; position:relative;}
.page.active{display:block;}

button{
  display:block; margin:10px auto; padding:12px 25px; font-size:18px; border-radius:25px; border:none; cursor:pointer;
  background: linear-gradient(135deg,#ffecb3,#ffe082); color:#1F2937; box-shadow: 2px 4px 10px rgba(0,0,0,0.2); transition:0.3s;
}
button:hover{ transform: translateY(-3px); box-shadow: 2px 6px 15px rgba(0,0,0,0.3); }
input,textarea{ padding:12px; border-radius:12px; border:1px solid #ddd; font-size:16px; margin:10px 0; width:80%; box-shadow: inset 1px 1px 5px rgba(0,0,0,0.05); }

.studentGrid{ display:grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap:20px; padding:20px; }
.studentCard{ background: #fff7e6; padding:15px; border-radius:20px; box-shadow: 0 6px 12px rgba(0,0,0,0.1); text-align:center; transition:0.3s; }
.studentCard:hover{ transform:translateY(-5px); }

.badge{ display:inline-block; padding:10px 20px; border-radius:15px; font-weight:bold; margin-top:10px; color:white; font-family:'Cairo',sans-serif; }
.gold{background:#FFD700;} .silver{background:#C0C0C0;} .bronze{background:#CD7F32;}

#encouragement{font-size:22px;font-weight:bold;margin-top:20px;color:#007BFF;}
#readingButtons, #evaluationButtons, #navButtons{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:15px; }
#readingButtons button, #evaluationButtons button{ margin:0; } 
#evaluationButtons input{ width:200px; margin:0; }

footer{ text-align:center; font-size:12px; color:#555; margin-top:30px; padding-bottom:15px; }

@keyframes fadeIn { 0% {opacity:0; transform: translateY(-20px);} 100% {opacity:1; transform: translateY(0);} }
@keyframes blink{ 0%{opacity:1;} 50%{opacity:0.6;} 100%{opacity:1;} }
#platformTitle{ font-size:48px; color:#ff6f61; text-shadow: 2px 2px #ffe082; animation:blink 1s infinite alternate; }
</style>
</head>
<body>
<div id="welcomePage" class="page active" style="animation:fadeIn 2s;">
  <h1 id="platformTitle">⚡ بَرق التعليمية</h1>
  <button onclick="showPage('teacherLogin')">ابدأ</button>
</div>
<div id="teacherLogin" class="page">
  <h2>تسجيل بيانات المعلم</h2>
  <input id="teacherName" placeholder="اسم المعلم">
  <input id="className" placeholder="اسم الصف">
  <input id="schoolName" placeholder="اسم المدرسة">
  <button onclick="saveTeacher()">تسجيل</button>
</div>
<div id="studentsPage" class="page">
  <h2>طلاب الصف</h2>
  <input id="newStudent" placeholder="اسم الطالب">
  <button id="addStudentBtn">إضافة طالب</button>
  <div class="studentGrid" id="studentsContainer"></div>
</div>
<div id="studentOptions" class="page">
  <h2 id="studentOptionName"></h2>
  <button onclick="openLibrary()">📚 مكتبة القراءة</button>
  <button onclick="addNewReading()">➕ إضافة قراءة جديدة</button>
</div>
<div id="readingPage" class="page">
  <h2 id="studentNameHeader"></h2>
  <input id="paragraphTitle" placeholder="عنوان الفقرة" style="width:60%; margin-bottom:10px;">
  <textarea id="paragraph" rows="4" placeholder="أدخل فقرة القراءة"></textarea>
  <div id="readingButtons">
    <button id="countWordsBtn">حساب الكلمات</button>
    <button id="startStopReadingBtn">بدء القراءة</button>
    <button id="registerErrorBtn">خطأ</button>
  </div>
  <p>عدد الكلمات: <span id="wordCount">0</span></p>
  <p>عدد الأخطاء: <span id="errors">0</span></p>
  <p>مدة القراءة: <span id="time">0</span> ثانية</p>
  <button style="margin-top:20px;" id="finishEvaluationBtn">إنهاء التقييم</button>
</div>
<div id="libraryPage" class="page">
  <h2 id="libraryTitle"></h2>
  <canvas id="progressChart" width="400" height="200"></canvas>
  <div id="readingList"></div>
  <button onclick="showPage('studentOptions')">عودة</button>
</div>
<div id="evaluationPage" class="page">
  <h2>نتيجة الطالب</h2>
  <p>السرعة: <span id="speed"></span> كلمة/دقيقة</p>
  <p>المستوى: <span id="level"></span></p>
  <div id="badgeDisplay" class="badge"></div>
  <p id="encouragement"></p>
  <div id="navButtons">
    <button onclick="showPage('welcomePage')">🏠 العودة إلى الصفحة الرئيسية</button>
    <button onclick="showPage('studentsPage')">👥 العودة إلى قائمة الطلاب</button>
    <button onclick="startNewEvaluation()">📝 تسجيل جديد</button>
  </div>
</div>
<footer>
  © جميع الحقوق محفوظة | إعداد وتصميم: أ. عائشة البروانية
</footer>
<script>
let teacher={}, students=[], currentStudent={}, readingWords=0, readingErrors=0, readingStopped=true, readingStartTime, readingTimer;
function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function saveTeacher(){ const tName=document.getElementById('teacherName').value.trim(); const cName=document.getElementById('className').value.trim(); const sName=document.getElementById('schoolName').value.trim(); if(!tName||!cName||!sName){alert("يرجى ملء جميع الحقول");return;} teacher={name:tName,class:cName,school:sName}; localStorage.setItem('teacher',JSON.stringify(teacher)); students=[]; localStorage.setItem('students',JSON.stringify(students)); loadStudents(); }
function loadStudents(){ students=JSON.parse(localStorage.getItem('students')||'[]'); const container=document.getElementById('studentsContainer'); container.innerHTML=''; if(students.length===0){container.innerHTML='<p style="color:#555;">لم يتم إضافة أي طلاب بعد</p>';} else{ students.forEach((s,i)=>{if(s.name){const div=document.createElement('div');div.className='studentCard';div.innerHTML=`<h4>${s.name}</h4><button onclick="openStudent(${i})">فتح</button>`;container.appendChild(div);}});} showPage('studentsPage'); }
document.getElementById('addStudentBtn').addEventListener('click',()=>{ const name=document.getElementById('newStudent').value.trim(); if(!name){ alert("يرجى إدخال اسم الطالب"); return; } students.push({name:name,evaluations:[]}); localStorage.setItem('students',JSON.stringify(students)); document.getElementById('newStudent').value=''; loadStudents(); });
function openStudent(i){ currentStudent=students[i]; document.getElementById('studentOptionName').innerText=currentStudent.name; showPage('studentOptions'); }
function addNewReading(){ document.getElementById('paragraph').value=''; document.getElementById('paragraphTitle').value=''; readingWords=0; readingErrors=0; readingStopped=true; document.getElementById('wordCount').innerText=0; document.getElementById('errors').innerText=0; document.getElementById('time').innerText=0; document.getElementById('startStopReadingBtn').innerText='بدء القراءة'; document.getElementById('studentNameHeader').innerText=currentStudent.name; showPage('readingPage'); }
function openLibrary(){ showPage('libraryPage'); document.getElementById('libraryTitle').innerText = currentStudent.name + " | مكتبة القراءة"; const list=document.getElementById('readingList'); list.innerHTML=''; if(currentStudent.evaluations.length===0){ list.innerHTML="<p>لا توجد قراءات حتى الآن.</p>"; } else{ currentStudent.evaluations.forEach(e=>{ list.innerHTML += `<div style="border:1px dashed #aaa; margin:5px; padding:5px; border-radius:10px;"><strong>${e.title||"بدون عنوان"}</strong> | ${new Date(e.date).toLocaleDateString()}<br>الكلمات: ${e.words}, الأخطاء: ${e.errors}, الوقت: ${e.time}s, السرعة: ${e.speed} كلمة/دقيقة, المستوى: ${e.level}, الوسام: ${e.badge}</div>`; }); } const labels=currentStudent.evaluations.map(e=>e.title||"قراءة"); const times=currentStudent.evaluations.map(e=>e.time); const speeds=currentStudent.evaluations.map(e=>e.speed); new Chart(document.getElementById('progressChart'),{ type:'bar', data:{ labels:labels, datasets:[{label:'الوقت المستغرق (ثواني)', data:times, backgroundColor:'#FFB74D'},{label:'سرعة القراءة (كلمة/دقيقة)', data:speeds, backgroundColor:'#4DB6AC'}] }, options:{ responsive:true, plugins:{legend:{position:'top'}} } }); }
document.getElementById('countWordsBtn').addEventListener('click',()=>{ const text=document.getElementById('paragraph').value.trim(); readingWords=text.split(/\s+/).filter(w=>w.length>0).length; document.getElementById('wordCount').innerText=readingWords; });
document.getElementById('startStopReadingBtn').addEventListener('click',()=>{ const display=document.getElementById('time'); if(readingStopped){ readingStartTime=Date.now(); readingTimer=setInterval(()=>{ display.innerText=Math.floor((Date.now()-readingStartTime)/1000); },1000); document.getElementById('startStopReadingBtn').innerText='إيقاف القراءة'; readingStopped=false; } else { clearInterval(readingTimer); document.getElementById('startStopReadingBtn').innerText='بدء القراءة'; readingStopped=true; } });
document.getElementById('registerErrorBtn').addEventListener('click',()=>{ readingErrors++; document.getElementById('errors').innerText=readingErrors; });
document.getElementById('finishEvaluationBtn').addEventListener('click',()=>{ if(!readingStopped) clearInterval(readingTimer); const elapsed=parseInt(document.getElementById('time').innerText)||1; const speed=Math.round(readingWords/elapsed*60); let level='يحتاج تحسين', badge='🥉 نحاسي', cls='bronze'; if(speed>=80 && readingErrors<=2){ level='ممتاز'; badge='🥇 ذهبي'; cls='gold'; } else if(readingErrors<=5){ level='جيد'; badge='🥈 فضي'; cls='silver'; } const title=document.getElementById('paragraphTitle').value; currentStudent.evaluations.push({date:new Date(), title:title, paragraph:document.getElementById('paragraph').value, words:readingWords, errors:readingErrors, time:elapsed, speed:speed, level:level, badge:badge}); localStorage.setItem('students',JSON.stringify(students)); document.getElementById('speed').innerText=speed; document.getElementById('level').innerText=level; const b=document.getElementById('badgeDisplay'); b.innerText=badge; b.className=`badge ${cls}`; document.getElementById('encouragement').innerText=level==='ممتاز'?"🌟 أداء رائع! استمر!":level==='جيد'?"👏 أحسنت! تقدّم جميل!":"💙 بداية موفقة! مع التدريب ستصبح أقوى!"; readingWords=0; readingErrors=0; readingStopped=true; document.getElementById('wordCount').innerText=0; document.getElementById('errors').innerText=0; document.getElementById('time').innerText=0; document.getElementById('startStopReadingBtn').innerText='بدء القراءة'; showPage('evaluationPage'); });
function startNewEvaluation(){ addNewReading(); }
window.onload=()=>{ const savedTeacher=localStorage.getItem('teacher'); if(savedTeacher){ teacher=JSON.parse(savedTeacher); loadStudents(); } }
</script>
</body>
</html>
